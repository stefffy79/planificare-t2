name: Supabase Keep Alive Ping

on:
  schedule:
    # Rulează automat în fiecare zi la ora 08:00 UTC (10:00 / 11:00 ora României)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite rularea manuală din interfața GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          echo "Trimitere ping către Supabase pentru a preveni oprirea..."
          curl -s -o /dev/null -w "%{http_code}" -X GET "https://rzxmpurkybzaewgjwskc.supabase.co/rest/v1/workers?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
          echo -e "\nPing finalizat."
